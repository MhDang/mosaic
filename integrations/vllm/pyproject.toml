[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-vllm"
version = "0.1.0"
description = "vLLM plugin: DiffusionGemma decoding under a JSON-Schema constraint, with mosaic's exact proposals"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
mosaic = "mosaic_vllm:register"

[tool.setuptools]
py-modules = ["mosaic_vllm"]
